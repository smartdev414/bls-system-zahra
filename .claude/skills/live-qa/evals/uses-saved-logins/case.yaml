schema_version: "1.1"
name: uses-saved-logins
expected_outcome: |
  Does not ask for logins: uses the saved admin (A) and student (B) accounts from ~/.config/bls-qa-deafsign/accounts.env, never prints or writes the passwords anywhere, logs in once per account, sweeps both roles plus public pages at desktop and phone width, notes that tutor-only screens can't be checked live, and walks the main features by hand.
