# Direct database access by IP + password (e.g. DbGate), for allow-listed IPs only.
#
#   198.244.201.81:15432 → original Teach Me Sign database (bls,       stack /opt/bls)
#   198.244.201.81:15434 → Deaf Signs database             (bls_zahra, this stack)
#
# Allowed client IPs live on the server only, in ~/bls-zahra/db-allow.conf
# (one "allow 1.2.3.4;" line each, not in git). Everyone else is refused before
# reaching Postgres. After editing it:
#   cd ~/bls-zahra && docker compose exec db-gateway nginx -s reload

worker_processes 1;
events { worker_connections 256; }

stream {
    include /etc/nginx/db-allow.conf;
    deny all;

    # Docker's DNS, re-resolved so a recreated database container is still found.
    resolver 127.0.0.11 valid=10s ipv6=off;

    log_format conn '$remote_addr [$time_local] port $server_port $status '
                    'sent $bytes_sent received $bytes_received $session_time s';
    access_log /dev/stdout conn;

    server {
        listen 15432;
        set $original db:5432;           # the original stack's database, via bls_default
        proxy_pass $original;
    }

    server {
        listen 15434;
        set $deafsigns zahra-db:5432;
        proxy_pass $deafsigns;
    }
}
