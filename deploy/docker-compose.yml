# DeafSign production stack. Shares the OVH server with the original BLS site
# (classroom.tms.webcam, stack "bls" in /opt/bls) but has its own database,
# web app and cron. Lives at /home/deploy/bls-zahra on the server; the CI
# pipeline copies this file there on every deploy (edit it in git, not there).
#
#   .env       compose settings: POSTGRES_PASSWORD, IMAGE_REPO, CRON
#   app.env    the app's secrets (LiveKit, S3, Mailgun, Pusher, …)
#   IMAGE_TAG  passed in by deploy.sh (the git commit being released)
#
# HTTPS: the original stack's Caddy owns ports 80/443. It loads
# /opt/bls/sites/*.caddy; deploy.sh writes deafsign.caddy there, which proxies
# bsl.deafsigns.co.uk to this stack's web container over the "bls_default"
# network (alias zahra-web).
#
# Service names must never be "web" or "db": a service that joins
# bls_default is reachable there by its name, and the original Caddy and cron
# call "web:3000". Hence zahra-web / zahra-db.

name: bls-zahra

services:
  zahra-db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bls_zahra
      POSTGRES_DB: bls_zahra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    # Reachable from the server itself only (psql / SSH tunnel on 5434).
    ports:
      - "127.0.0.1:5434:5432"
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bls_zahra -d bls_zahra"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: applies pending prisma/migrations before each release.
  migrate:
    image: ${IMAGE_REPO:?}-migrate:${IMAGE_TAG:-latest}
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql://bls_zahra:${POSTGRES_PASSWORD}@zahra-db:5432/bls_zahra
    depends_on:
      zahra-db:
        condition: service_healthy

  zahra-web:
    image: ${IMAGE_REPO:?}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: app.env
    environment:
      DATABASE_URL: postgresql://bls_zahra:${POSTGRES_PASSWORD}@zahra-db:5432/bls_zahra
    networks:
      default: {}
      edge:
        aliases: [zahra-web]
    depends_on:
      zahra-db:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  # Automatic reminders + expired test-video clean-up, every 10 minutes.
  zahra-cron:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    env_file: app.env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          sleep 600
          curl -sS -m 120 -H "Authorization: Bearer $$CRON_SECRET" http://zahra-web:3000/api/cron/reminders || true
          echo
        done
    depends_on:
      - zahra-web

  # Direct DB access (DbGate etc.) for allow-listed IPs: public ports 15432
  # (original "bls" DB) and 15434 (this stack's DB). See db-gateway.conf.
  db-gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${PUBLIC_IP:-198.244.201.81}:15432:15432"
      - "${PUBLIC_IP:-198.244.201.81}:15434:15434"
    volumes:
      - ./db-gateway.conf:/etc/nginx/nginx.conf:ro
      - ./db-allow.conf:/etc/nginx/db-allow.conf:ro
    networks:
      default: {}
      edge: {}
    depends_on:
      - zahra-db

networks:
  # The original stack's network, where its Caddy lives.
  edge:
    external: true
    name: bls_default

volumes:
  pgdata:
