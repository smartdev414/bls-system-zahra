# Every push to main goes live on the OVH server (bsl.deafsigns.co.uk):
# copy the code to the server, build it there, apply database migrations,
# restart. If the new version fails its health check, the old one stays.
#
# This is the DeafSign copy of the BLS platform. It shares the server with
# the original site (classroom.tms.webcam, /opt/bls) but deploys only its own
# stack in /home/deploy/bls-zahra and never restarts the original.
#
# Needs one repository secret: OVH_SSH_KEY (private key of the "deploy" user).
# Rollback by hand on the server: SKIP_PULL=yes ~/bls-zahra/deploy.sh <older-sha>
name: Deploy to OVH

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ovh-zahra
  cancel-in-progress: false

env:
  SITE_URL: https://bsl.deafsigns.co.uk
  REMOTE_DIR: /home/deploy/bls-zahra

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Connect to the server
        env:
          SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          # tr: a key pasted from Windows carries \r line endings, which ssh rejects
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null || { echo "::error::OVH_SSH_KEY is not a valid private key. Paste the whole file, BEGIN and END lines included."; exit 1; }
          echo "[198.244.201.81]:32984 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAID7STpGbfqd6W357ecYqATlZlXg9O5tpDsHazzwGtfpR" > ~/.ssh/known_hosts
          printf 'Host ovh\n  HostName 198.244.201.81\n  Port 32984\n  User deploy\n  IdentityFile ~/.ssh/id_deploy\n' > ~/.ssh/config

      - name: Copy code
        run: |
          rsync -az --delete --exclude .git --exclude node_modules --exclude .next ./ "ovh:$REMOTE_DIR/src/"

      - name: Build and release
        run: ssh ovh "bash $REMOTE_DIR/src/deploy/release.sh ${GITHUB_SHA::7}"

      # The source is only needed for the build; don't leave it on the server.
      # (No "docker builder prune" here: it would also wipe the build cache of
      # the original site, which may be building at the same time.)
      - name: Remove the source from the server
        if: always()
        run: ssh ovh "rm -rf $REMOTE_DIR/src"

      - name: Check the app on the server
        run: ssh ovh "docker exec bls-zahra-zahra-web-1 node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>{console.log(r.status);process.exit(r.ok?0:1)})\""

      # Fails until the domain's DNS points at 198.244.201.81; warning only.
      - name: Check the live site
        run: |
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "$SITE_URL/api/health" \
            || echo "::warning::$SITE_URL is not reachable yet (DNS A record must point at 198.244.201.81)."
